name: Lean 4.21.0 full finite-plan verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt -r requirements-numerics.txt
      - run: python -m pip install .
      - name: Install official pinned Lean binary with SHA-256 verification
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.21.0/lean-4.21.0-linux.tar.zst --output "$RUNNER_TEMP/lean.tar.zst"
          echo "455c6df09d5bd54d2a51b137939c47e2dda816d512ac789c4b3642c9bf98bde8  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.21.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fresh library, 24 statements, four complete positive roots, negative root and same-plan execution
        run: python scripts/check_formal.py --output-dir results/formal-check
      - name: Full tests with mandatory dense integration already verified
        run: python -m unittest discover -s tests -v

name: Core and analytic fixtures (no external engine)
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt -r requirements-numerics.txt
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/algebraic_closure.py --output results/closure.json
      - run: python scripts/replay_coverage.py --inputs evidence/coverage/inputs.json --output results/coverage.json
